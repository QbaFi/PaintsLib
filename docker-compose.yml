services:
  app:
    build: .
    image: paintslib:latest
    container_name: paintslib
    ports:
      # Only reachable from this computer. Change to "8080:8000" to open it to your local network.
      - "127.0.0.1:${PORT:-8080}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - paintslib-data:/data
    restart: unless-stopped

volumes:
  paintslib-data:
